services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vida
      POSTGRES_USER: vida
      POSTGRES_PASSWORD: vida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vida -d vida"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    profiles: ["api"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/vida
      DB_USER: vida
      DB_PASSWORD: vida
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
