spring:
  application:
    name: vida-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vida}
    username: ${DB_USER:vida}
    password: ${DB_PASSWORD:vida}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    context-path: /api
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs
